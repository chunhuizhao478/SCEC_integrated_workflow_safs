[pytest]
markers =
    slow: executes the notebook end to end (a few seconds, but spawns a kernel)
filterwarnings =
    ignore::DeprecationWarning
    # netCDF4's Cython extension is built against numpy 2 headers -- every current
    # conda-forge build declares `numpy >=1.23,<3` -- while this environment pins
    # numpy 1.26 so scipy's Delaunay stays fixed for the CVM rebuild.  Importing it
    # under numpy 1.x therefore emits an ndarray-ABI RuntimeWarning.
    #
    # Suppressed only after verifying the data path is sound: the axes and every
    # compound float32 member survive a write/read round trip BIT-IDENTICALLY through
    # this exact build (test_asagi.py::test_write_read_roundtrip_is_exact, plus
    # data-exact comparisons against 380 MB shipped production ncs).
    #
    # Deliberately narrow -- matched on the message AND the module, so a genuine ABI
    # break anywhere else still fails loudly.  Delete this line if the stack ever
    # moves to numpy 2.
    # The module field must be `importlib._bootstrap`, NOT `netCDF4`: the warning is
    # raised by the import machinery while executing the extension's module body, so
    # that is the frame pytest attributes it to.  Matching on netCDF4 silently does
    # nothing -- verify any change here actually suppresses, do not assume.
    ignore:numpy.ndarray size changed.*:RuntimeWarning:importlib._bootstrap
