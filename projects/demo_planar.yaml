# demo_planar -- a tiny synthetic fault system that runs with ZERO downloads.
#
# This is the example a new user runs first: a 60 x 15 km vertical strike-slip fault in a
# three-layer 1-D medium, with a uniform stress orientation and a depth-parameterised
# friction law.  It exercises every stage of the workflow without needing any community
# model.  Phase 7 fills in the synthetic generators and the pre-built mesh; Phase 0 only
# establishes that this descriptor is schema-valid.
#
# NOTE the deliberately non-SAFS choices: a different UTM zone, a different strike, a
# different origin.  If any SAFS constant leaks into deckbuild/, this project breaks.

name: demo_planar

crs:
  epsg: "EPSG:32610"              # UTM 10N -- deliberately NOT the SAFS zone
  geographic_epsg: "EPSG:4326"

strike:
  azimuth_deg: 0.0                # due north; s increases northward
  origin_xy: [500000.0, 4000000.0]

stress_box:
  xmin: 470000.0
  xmax: 530000.0
  ymin: 3970000.0
  ymax: 4040000.0
  zmin: -20000.0
  zmax: 0.0
  dx: 1000.0
  dz: 250.0

meshes:
  planar:
    path: demo_planar.puml.h5     # committed under data/demo/ (Phase 7)
    fault_bc: 3
    tag_to_bc: {101: 3, 102: 1, 103: 5, 104: 5}
    daylights: false
    daylight_min_depth_m: 0.0
    gates:                        # the demo mesh is DELIBERATELY coarse: it demonstrates
      fault_edge_max_m: 4000.0    # the pipeline, not a production resolution.  SAFS uses
      f_gate_hz: 0.05             # 500 m / 0.6667 Hz -- see projects/safs_alt.yaml.
      partition_tol_m: 50.0

default_mesh: planar

# A synthetic restraining bend, so the gate machinery has something to score.
gate_bands:
  - {s_start_km: 20.0, s_end_km: 30.0, name: demo bend}

hypocenters:
  planar:
    # Given geographically, to exercise the lon/lat path.  This projects to
    # (500000, 4005000) in EPSG:32610 -- mid-fault, ON the plane x = 500000.
    # An earlier draft used (-121, 36), which lands 180 km east of the fault; Stage F's
    # snap gate caught it, which is exactly what that gate is for.
    lon: -123.0
    lat: 36.189797
    depth_m: 8000.0
    snap_tol_m: 2000.0
    label: "demo 8 km hypocentre"

# Every physics default is inherited; a demo has no reason to differ.
physics: {}

raw:
  orientation:
    kind: constant                # no community stress model
    params:
      azimuth_deg: 45.0           # SHmax
      shape_ratio: 0.5            # R
  velocity:
    kind: layered_1d              # no community velocity model
    params:
      depth_m: [0.0, 2000.0, 8000.0, 20000.0]
      vp: [3000.0, 5000.0, 6200.0, 6800.0]
      vs: [1700.0, 2900.0, 3600.0, 3900.0]
      rho: [2200.0, 2500.0, 2700.0, 2800.0]
      grid_dx: 2000.0
      dz: 250.0
      z_min: -20000.0
      z_max: 0.0
  thermal:
    kind: depth_profile           # no community thermal model
    params:
      a_minus_b_knots_m: [0.0, -3000.0, -12000.0, -15000.0]
      a_minus_b_values: [0.004, -0.004, -0.004, 0.004]
      vw_knots_m: [0.0, -14000.0, -16000.0]
      vw_values: [0.05, 0.05, 1000.0]

provenance:
  purpose: "shipped worked example; must Run-All in under 5 minutes with no downloads"
